# Apache Ossie Core Metadata Specification twin of models/building-permits (TMDL).
# Schema: https://github.com/apache/ossie/blob/main/core-spec/ossie-schema.json
# Schema version const 0.3.0.dev0, fetched 25 Nov 2026 (apache/ossie main @ 7b8ed65).
# Portable dialect: OSSIE_SQL_2026 (the `sql` key). DAX entries are opaque to Ossie.
# Sources are logical names, not warehouse tables: the Power BI model loads through Power Query.
# Not deployed. Validate with tools/ossie-check.
version: 0.3.0.dev0
name: building_permits
datasets:
- name: apply_date
  source: building_permits.apply_date
  description: 'Application calendar: the day the owner asked. A leading indicator; Boston, Philadelphia and many
    LA over-the-counter rows have no apply date. Marked as a date table. A slicer here filters only this date role;
    Issue Date, Apply Date and Final Date are three calendars on the same days (CMS/NOAA role-playing lesson).'
  primary_key:
  - date
  fields:
  - name: date
    expression:
      sql: date
    dimension:
      is_time: true
    datatype: Date
    description: Calendar date. Primary key, related to 'Fact Permit'[Applied Date].
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        format_string: yyyy-mm-dd
  - name: year
    expression:
      sql: year
    datatype: Integer
    description: Calendar year, for example 2026.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        format_string: '0'
  - name: quarter
    expression:
      sql: quarter
    datatype: String
    description: Quarter of the year as text, Q1 to Q4. Sorted by Quarter Number.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        sort_by_column: Quarter Number
  - name: quarter_number
    expression:
      sql: quarter_number
    datatype: Integer
    description: Quarter of the year as a number, 1 to 4.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        is_hidden: true
        format_string: '0'
  - name: year_quarter
    expression:
      sql: year_quarter
    datatype: String
    description: Year and quarter, for example 2026 Q3. Sorted by Year Quarter Number.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        sort_by_column: Year Quarter Number
  - name: year_quarter_number
    expression:
      sql: year_quarter_number
    datatype: Integer
    description: 'Sort key for Year Quarter: year times 10 plus quarter.'
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        is_hidden: true
        format_string: '0'
  - name: month
    expression:
      sql: month
    datatype: String
    description: Full month name, January to December. Sorted by Month Number.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        sort_by_column: Month Number
  - name: month_short
    expression:
      sql: month_short
    datatype: String
    description: Abbreviated month name, Jan to Dec. Sorted by Month Number.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        sort_by_column: Month Number
  - name: month_number
    expression:
      sql: month_number
    datatype: Integer
    description: Month of the year as a number, 1 to 12.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        format_string: '0'
  - name: year_month
    expression:
      sql: year_month
    datatype: String
    description: Year and month as YYYY-MM. Sorted by Year Month Sort.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        sort_by_column: Year Month Sort
  - name: year_month_sort
    expression:
      sql: year_month_sort
    datatype: Integer
    description: 'Sort key for Year Month: year times 100 plus month.'
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        is_hidden: true
        format_string: '0'
  - name: month_start
    expression:
      sql: month_start
    dimension:
      is_time: true
    datatype: Date
    description: First day of the month the date falls in.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        format_string: yyyy-mm-dd
- name: category
  source: building_permits.category
  description: 'The 14 common work categories from the data factory crosswalk (schema.md). Compare categories, not
    raw permit totals: NYC issues one work permit per trade per job and Seattle''s file holds no trades.'
  primary_key:
  - category_key
  fields:
  - name: category_key
    expression:
      sql: category_key
    datatype: String
    description: Category code as stored on the fact, for example new_residential. Primary key.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        is_hidden: true
  - name: category
    expression:
      sql: category
    datatype: String
    description: Display name, for example New residential.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        sort_by_column: Category Sort
  - name: work_class
    expression:
      sql: work_class
    datatype: String
    description: 'Work class the category belongs to: new, addition, alteration, demolition, trade or other.'
  - name: category_sort
    expression:
      sql: category_sort
    datatype: Integer
    description: Sort order matching schema.md.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        is_hidden: true
        format_string: '0'
- name: fact_permit
  source: building_permits.fact_permit
  description: 'Fact table: one row per permit as the city defines a permit (the data factory''s permits.parquet).
    Housing Units Contribution already de-duplicates Austin related building permits that copy the same unit count
    under one master, includes Los Angeles mixed-use apartments filed as commercial, and is zero on every other
    category. Every column is hidden; analysis goes through the measures and the dimensions. Counts follow Issue
    Date unless the visual uses Apply Date or Final Date.'
  fields:
  - name: permit_key
    expression:
      sql: permit_key
    datatype: String
    description: Jurisdiction and source permit number, unique across the ten cities.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        is_hidden: true
  - name: jurisdiction
    expression:
      sql: jurisdiction
    datatype: String
    description: Jurisdiction name, related to Jurisdiction.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        is_hidden: true
  - name: category_key
    expression:
      sql: category_key
    datatype: String
    description: Category code, related to Category.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        is_hidden: true
  - name: work_class
    expression:
      sql: work_class
    datatype: String
    description: Work class, related to Work Class.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        is_hidden: true
  - name: use_class
    expression:
      sql: use_class
    datatype: String
    description: Use class, related to Use Class.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        is_hidden: true
  - name: status
    expression:
      sql: status
    datatype: String
    description: Status, related to Status.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        is_hidden: true
  - name: applied_date
    expression:
      sql: applied_date
    dimension:
      is_time: true
    datatype: Date
    description: Application / filing date, related to Apply Date.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        is_hidden: true
        format_string: yyyy-mm-dd
  - name: issued_date
    expression:
      sql: issued_date
    dimension:
      is_time: true
    datatype: Date
    description: Permit issued date, related to Issue Date. Headline counts use this date.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        is_hidden: true
        format_string: yyyy-mm-dd
  - name: final_date
    expression:
      sql: final_date
    dimension:
      is_time: true
    datatype: Date
    description: Final / certificate date, related to Final Date.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        is_hidden: true
        format_string: yyyy-mm-dd
  - name: units_added
    expression:
      sql: units_added
    datatype: Integer
    description: Net dwelling units the source published on this permit. Can repeat across Austin related permits;
      do not SUM this. Use Housing Units.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        is_hidden: true
        format_string: '#,0'
  - name: housing_units_contribution
    expression:
      sql: housing_units_contribution
    datatype: Integer
    description: Dwelling units this row contributes to Housing Units after Austin de-duplication and Los Angeles
      mixed-use inclusion.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        is_hidden: true
        format_string: '#,0'
  - name: valuation_usable
    expression:
      sql: valuation_usable
    datatype: Decimal
    description: Declared value included in Valuation USD (blank for Austin and for values outside 1 .. 2e9).
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        is_hidden: true
        format_string: \$#,0;(\$#,0);\$#,0
  - name: days_apply_to_issue
    expression:
      sql: days_apply_to_issue
    datatype: Integer
    description: Issued date minus applied date, only when both exist and issue is on or after apply.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        is_hidden: true
        format_string: '#,0'
  metrics:
  - name: permits
    expression:
      sql: COUNT(*)
    datatype: Integer
    description: Permits in context, every category and jurisdiction. A permit is not the same unit everywhere (NYC
      issues one work permit per trade per job; Seattle's file holds no trades), so compare categories.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        dax: COUNTROWS ( 'Fact Permit' )
        format_string: '#,0'
        display_folder: Volume
  - name: housing_units
    expression:
      sql: SUM(housing_units_contribution)
    datatype: Decimal
    description: Net dwelling units on new homes, Census BPS convention (issue date). Austin related permits that
      copy the same unit count onto every building permit under one master (phases, fire areas, amenity buildings,
      identical descriptions on 2–4 permits) count once. Los Angeles mixed-use apartment buildings filed as Bldg-New
      Commercial Apartment are included. Boston, New Orleans and Montgomery County publish no usable unit counts
      (blank here). Alteration conversions are excluded, matching BPS.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        dax: SUM ( 'Fact Permit'[Housing Units Contribution] )
        format_string: '#,0'
        display_folder: Housing
  - name: units_in_200_plus_permits
    expression:
      sql: SUM(housing_units_contribution) FILTER (WHERE units_added >= 200)
    datatype: Decimal
    description: Housing units on permits of 200 or more units. The numerator of Share of units in 200+ permits.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        dax: CALCULATE ( [Housing Units], KEEPFILTERS ( 'Fact Permit'[Units Added] >= 200 ) )
        format_string: '#,0'
        display_folder: Housing
  - name: share_of_units_in_200_plus_permits
    expression:
      sql: SUM(housing_units_contribution) FILTER (WHERE units_added >= 200) / NULLIF(SUM(housing_units_contribution),
        0)
    datatype: Decimal
    description: Share of Housing Units that sit on permits of 200 or more units (towers). New York 41% in 2023–2025;
      Los Angeles 4%.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        dax: DIVIDE ( [Units in 200+ Permits], [Housing Units] )
        format_string: 0%
        display_folder: Housing
  - name: median_days_apply_to_issue
    expression:
      sql: MEDIAN(days_apply_to_issue)
    datatype: Decimal
    description: Median calendar days from application to issue for rows that have both dates and issue on or after
      apply. FINDINGS.md reports this on new residential by issue year.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        dax: MEDIAN ( 'Fact Permit'[Days Apply To Issue] )
        format_string: '#,0'
        display_folder: Speed
  - name: same_day_issue_share
    expression:
      sql: COALESCE(COUNT(*) FILTER (WHERE days_apply_to_issue = 0), 0) / NULLIF(COUNT(*) FILTER (WHERE days_apply_to_issue
        IS NOT NULL), 0)
    datatype: Decimal
    description: Share of permits in context issued the same day they were filed (Days Apply To Issue = 0).
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        dax: DIVIDE ( COALESCE ( CALCULATE ( [Permits], KEEPFILTERS ( 'Fact Permit'[Days Apply To Issue] = 0 ) ),
          0 ), CALCULATE ( [Permits], KEEPFILTERS ( NOT ISBLANK ( 'Fact Permit'[Days Apply To Issue] ) ) ) )
        format_string: 0%
        display_folder: Speed
  - name: valuation_usd
    expression:
      sql: SUM(valuation_usable)
    datatype: Decimal
    description: Declared job value, US dollars, excluding Austin (the field is copied onto trades and is unusable)
      and values outside 1 .. 2 billion (NYC $1,000 placeholders and a handful of overflows). Philadelphia publishes
      none. Self-declared and nominal; within-city trends are sounder than cross-city levels.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        dax: SUM ( 'Fact Permit'[Valuation Usable] )
        format_string: $#,0;($#,0);$#,0
        display_folder: Value
  - name: last_issue_date
    expression:
      sql: MAX(issued_date)
    datatype: Date
    description: Last issue date in context, used by the prior-year measures.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        dax: MAX ( 'Fact Permit'[Issued Date] )
        format_string: yyyy-mm-dd
        display_folder: Time
        is_hidden: true
  - name: applications
    expression:
      sql: COUNT(*) FILTER (WHERE applied_date IS NOT NULL)
    datatype: Decimal
    description: Permits that have an application date in context (Apply Date). Boston and Philadelphia publish
      issued permits only.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        dax: CALCULATE ( [Permits], KEEPFILTERS ( NOT ISBLANK ( 'Fact Permit'[Applied Date] ) ) )
        format_string: '#,0'
        display_folder: Pipeline
  - name: finaled_permits
    expression:
      sql: COUNT(*) FILTER (WHERE final_date IS NOT NULL)
    datatype: Decimal
    description: Permits that have a final / certificate date in context (Final Date). Recent years are incomplete
      by construction.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        dax: CALCULATE ( [Permits], KEEPFILTERS ( NOT ISBLANK ( 'Fact Permit'[Final Date] ) ) )
        format_string: '#,0'
        display_folder: Pipeline

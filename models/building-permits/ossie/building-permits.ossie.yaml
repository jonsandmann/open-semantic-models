metrics:
- name: housing_units_per_1_000_per_year
  expression:
    dialects:
    - dialect: DAX
      expression: VAR Years = CALCULATE ( DISTINCTCOUNT ( 'Issue Date'[Year] ), 'Fact Permit'[Housing Units Contribution]
        <> 0 ) VAR Pop = MAX ( Jurisdiction[Population] ) VAR One = DISTINCTCOUNT ( Jurisdiction[Jurisdiction] )
        = 1 RETURN IF ( One, DIVIDE ( [Housing Units], Years * Pop ) * 1000 )
  datatype: Decimal
  description: 'Housing Units per 1,000 residents per year in context. Population is Census Vintage 2024 on Jurisdiction.
    The year count is distinct Issue Date years that have housing units, so a 2024–2025 Chicago slice divides by
    two. No OSSIE_SQL_2026 expression: blank unless one jurisdiction is in the filters; divides by that jurisdiction''s
    population (from the Jurisdiction table) and by the number of issue years with housing units. Needs the filter
    guard and fields of two other datasets.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '0.00'
      display_folder: Housing
- name: new_construction_valuation
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE ( [Valuation USD], KEEPFILTERS ( Category[Work Class] = "new" ) )
  datatype: Decimal
  description: 'New-construction declared value: Valuation USD on new residential and new non-residential only.
    No OSSIE_SQL_2026 expression: `FILTER (WHERE ...)` may only reference the aggregate''s own dataset, and the
    fact has no copy of that column.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: $#,0;($#,0);$#,0
      display_folder: Value
- name: permits_prior_year
  expression:
    dialects:
    - dialect: DAX
      expression: VAR LastDay = [Last Issue Date] RETURN CALCULATE ( [Permits], SAMEPERIODLASTYEAR ( FILTER ( VALUES
        ( 'Issue Date'[Date] ), 'Issue Date'[Date] <= LastDay ) ) )
  datatype: Decimal
  description: 'Permits in the same Issue Date period one year earlier, through the last loaded issue date. No OSSIE_SQL_2026
    expression: `SAMEPERIODLASTYEAR` shifts or accumulates dates through the Power BI date table. OSSIE_SQL_2026
    has no time-intelligence functions, and a metric can''t move the query''s date filter.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '#,0'
      display_folder: Time
- name: permits_yoy_pct
  expression:
    dialects:
    - dialect: DAX
      expression: DIVIDE ( [Permits] - [Permits Prior Year], [Permits Prior Year] )
  datatype: Decimal
  description: 'Year-over-year change in Permits. Blank when the current value is blank. No OSSIE_SQL_2026 expression:
    Depends on `permits_prior_year`, which doesn''t port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: 0.0%
      display_folder: Time
- name: housing_units_prior_year
  expression:
    dialects:
    - dialect: DAX
      expression: VAR LastDay = [Last Issue Date] RETURN CALCULATE ( [Housing Units], SAMEPERIODLASTYEAR ( FILTER
        ( VALUES ( 'Issue Date'[Date] ), 'Issue Date'[Date] <= LastDay ) ) )
  datatype: Decimal
  description: 'Housing Units in the same Issue Date period one year earlier. No OSSIE_SQL_2026 expression: `SAMEPERIODLASTYEAR`
    shifts or accumulates dates through the Power BI date table. OSSIE_SQL_2026 has no time-intelligence functions,
    and a metric can''t move the query''s date filter.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '#,0'
      display_folder: Time
- name: housing_units_yoy_pct
  expression:
    dialects:
    - dialect: DAX
      expression: DIVIDE ( [Housing Units] - [Housing Units Prior Year], [Housing Units Prior Year] )
  datatype: Decimal
  description: 'Year-over-year change in Housing Units. Blank when the current value is blank. No OSSIE_SQL_2026
    expression: Depends on `housing_units_prior_year`, which doesn''t port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: 0.0%
      display_folder: Time
- name: attribution
  expression:
    dialects:
    - dialect: DAX
      expression: '"Joined from ten open building-permit datasets (Seattle SDCI, NYC DOB, Chicago, San Francisco
        DBI, Los Angeles LADBS, Austin DSD, Boston ISD, Philadelphia L&I, New Orleans Safety & Permits, Montgomery
        County MD DPS). Population: Census Bureau Vintage 2024. See each Jurisdiction[Licence]."'
  datatype: String
  description: 'Required attribution for reports built from this model. No OSSIE_SQL_2026 expression: a citation
    or attribution string. Kept in the DAX dialect for reports; there is nothing to aggregate.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '@'
      display_folder: About

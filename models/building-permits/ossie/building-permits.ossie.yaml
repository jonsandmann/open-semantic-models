- name: jurisdiction
  source: building_permits.jurisdiction
  description: The ten jurisdictions in the data factory join. Population is Census Vintage 2024 place (or county
    for Montgomery). Units Published is false where the source has no dwelling-unit field (Boston, New Orleans)
    or only a 1-per-house proxy (Montgomery County). Static table from the factory's analyze.py and SOURCES.md.
  primary_key:
  - jurisdiction
  fields:
  - name: jurisdiction
    expression:
      sql: jurisdiction
    datatype: String
    description: Jurisdiction name as stored on the fact, for example Austin, TX. Primary key.
  - name: population
    expression:
      sql: population
    datatype: Integer
    description: Census Vintage 2024 resident population of the city (Montgomery County, MD is the county). Denominator
      of Housing Units per 1,000 per Year.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        format_string: '#,0'
  - name: units_published
    expression:
      sql: units_published
    datatype: Boolean
    description: True when the source publishes a usable net dwelling-unit count on new residential work. False
      for Boston, New Orleans and Montgomery County.
  - name: licence
    expression:
      sql: licence
    datatype: String
    description: Licence of the published dataset, as verified 24 Nov 2026.
- name: status
  source: building_permits.status
  description: Current status as mapped by the data factory from each source's own status string.
  primary_key:
  - status
  fields:
  - name: status
    expression:
      sql: status
    datatype: String
    description: Status key, related to 'Fact Permit'[Status]. Primary key.
  - name: status_label
    expression:
      sql: status_label
    datatype: String
    description: Display label.
- name: use_class
  source: building_permits.use_class
  description: 'Use of the building as mapped by the data factory: residential, nonresidential, mixed, residential_or_mixed
    (NYC Other buildings with dwelling units), unknown.'
  primary_key:
  - use_class
  fields:
  - name: use_class
    expression:
      sql: use_class
    datatype: String
    description: Use class key, related to 'Fact Permit'[Use Class]. Primary key.
  - name: use_class_label
    expression:
      sql: use_class_label
    datatype: String
    description: Display label.
- name: work_class
  source: building_permits.work_class
  description: 'Work class derived from category: new, addition, alteration, demolition, trade, other.'
  primary_key:
  - work_class
  fields:
  - name: work_class
    expression:
      sql: work_class
    datatype: String
    description: Work class key, related to 'Fact Permit'[Work Class]. Primary key.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        sort_by_column: Work Class Sort
  - name: work_class_sort
    expression:
      sql: work_class_sort
    datatype: Integer
    description: 'Sort order for Work Class: new, addition, alteration, demolition, trade, other.'
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        is_hidden: true
        format_string: '0'
relationships:
- name: fact_permit_to_issue_date
  from: fact_permit
  to: issue_date
  from_columns:
  - issued_date
  to_columns:
  - date

metrics:
- name: inspections_with_a_verdict
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE ( [Inspections], KEEPFILTERS ( NOT ISBLANK ( Outcome[Tier] ) ) )
  datatype: Decimal
  description: 'Inspections with a published verdict mapped to a tier (blank tier excluded: Delaware and New York
    State publish no verdict; no-entry, out-of-business and educational visits have none). No OSSIE_SQL_2026 expression:
    `FILTER (WHERE ...)` may only reference the aggregate''s own dataset, and the fact has no copy of that column.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '#,0'
      display_folder: Outcomes
- name: re_inspection_rate_at_3_plus_criticals
  expression:
    dialects:
    - dialect: DAX
      expression: VAR AtThree = CALCULATE ( [Inspections with a verdict], KEEPFILTERS ( 'Critical Band'[Critical
        Band Key] = 3 ) ) VAR Acted = CALCULATE ( [Inspections with a verdict], KEEPFILTERS ( 'Critical Band'[Critical
        Band Key] = 3 ), KEEPFILTERS ( Outcome[Tier] >= 2 ) ) RETURN DIVIDE ( COALESCE ( Acted, 0 ), AtThree )
  datatype: Decimal
  description: 'Comparable across jurisdictions. Of rated inspections that cited three or more critical violations,
    the share whose verdict ordered a re-inspection or worse (tier 2 or 3: conditional pass, fail, B or C grade,
    closure). Holds the findings constant, so it compares how jurisdictions act on the same findings. Toronto''s
    critical includes Significant items, which is most of its lower rate. No OSSIE_SQL_2026 expression: Depends
    on `inspections_with_a_verdict`, which doesn''t port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: 0.0%
      display_folder: Outcomes
- name: closures
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE ( [Inspections], KEEPFILTERS ( Outcome[Closed] = TRUE () ) )
  datatype: Decimal
  description: 'Closures (Outcome[Closed]) in context. No OSSIE_SQL_2026 expression: `FILTER (WHERE ...)` may only
    reference the aggregate''s own dataset, and the fact has no copy of that column.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '#,0'
      display_folder: Outcomes
- name: closure_rate
  expression:
    dialects:
    - dialect: DAX
      expression: DIVIDE ( COALESCE ( [Closures], 0 ), [Inspections with a verdict] )
  datatype: Decimal
  description: 'Closures as a share of rated inspections. A closure is the one verdict that means the same everywhere,
    but the findings behind it still differ: read it at a fixed Critical Band, or use Closure rate at 3+ criticals.
    No OSSIE_SQL_2026 expression: Depends on `closures`, which doesn''t port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: 0.0%
      display_folder: Outcomes
- name: closure_rate_at_3_plus_criticals
  expression:
    dialects:
    - dialect: DAX
      expression: DIVIDE ( COALESCE ( CALCULATE ( [Closures], KEEPFILTERS ( 'Critical Band'[Critical Band Key] =
        3 ) ), 0 ), CALCULATE ( [Inspections with a verdict], KEEPFILTERS ( 'Critical Band'[Critical Band Key] =
        3 ) ) )
  datatype: Decimal
  description: 'Comparable across jurisdictions. Of rated inspections that cited three or more critical violations,
    the share that closed the establishment. No OSSIE_SQL_2026 expression: Depends on `closures`, which doesn''t
    port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: 0.0%
      display_folder: Outcomes
- name: published_outcome
  expression:
    dialects:
    - dialect: DAX
      expression: DIVIDE ( COALESCE ( CALCULATE ( [Inspections with a verdict], KEEPFILTERS ( Outcome[Tier] = 3
        ) ), 0 ), [Inspections with a verdict] )
  datatype: Decimal
  description: 'NOT COMPARABLE ACROSS JURISDICTIONS. The share of rated inspections whose published verdict is the
    jurisdiction''s worst (tier 3: Boston and Chicago fail, King County Unsatisfactory, Toronto and Marin closure,
    NYC C grade or closure). Each jurisdiction''s tier 3 is a different event with a different trigger (Jurisdiction[Fail
    Means]), so Boston''s 40% and Toronto''s 0.1% compare rulebooks, not kitchens. Use it within one jurisdiction
    over time; across jurisdictions use Critical violations per inspection and the rates at 3+ criticals. No OSSIE_SQL_2026
    expression: Depends on `inspections_with_a_verdict`, which doesn''t port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: 0.0%
      display_folder: Outcomes
- name: last_inspection_date
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE ( MAX ( 'Fact Inspection'[Inspection Date] ), REMOVEFILTERS () )
  datatype: Date
  description: 'Latest inspection date in the model, ignoring every filter (Delaware publishes two inspections dated
    4 December 2026). The prior-year measures read it. No OSSIE_SQL_2026 expression: `REMOVEFILTERS` reads or removes
    what the report has filtered. OSSIE_SQL_2026 metrics have no filter context: no ALL, REMOVEFILTERS, ISFILTERED
    or HASONEVALUE.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: yyyy-mm-dd
      display_folder: Time
      is_hidden: true
- name: inspections_prior_year
  expression:
    dialects:
    - dialect: DAX
      expression: VAR LastDay = [Last inspection date] RETURN CALCULATE ( [Inspections], SAMEPERIODLASTYEAR ( FILTER
        ( VALUES ( 'Date'[Date] ), 'Date'[Date] <= LastDay ) ) )
  datatype: Decimal
  description: 'Inspections in the same period one year earlier, over the days up to the last inspection date. Jurisdictions
    start on different dates (Jurisdiction[Data From]): Austin and Toronto from November 2023, Montgomery from June
    2024, Delaware from November 2024, so their prior years before those dates are partial or empty. No OSSIE_SQL_2026
    expression: `SAMEPERIODLASTYEAR` shifts or accumulates dates through the Power BI date table. OSSIE_SQL_2026
    has no time-intelligence functions, and a metric can''t move the query''s date filter.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '#,0'
      display_folder: Time
- name: inspections_yoy_pct
  expression:
    dialects:
    - dialect: DAX
      expression: IF ( NOT ISBLANK ( [Inspections] ), DIVIDE ( [Inspections] - [Inspections prior year], [Inspections
        prior year] ) )
  datatype: Decimal
  description: 'Change in inspections against the same period a year earlier, as a percentage of the prior year.
    No OSSIE_SQL_2026 expression: Depends on `inspections_prior_year`, which doesn''t port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: +0.0%;-0.0%;0.0%
      display_folder: Time
- name: violations_per_inspection
  expression:
    dialects:
    - dialect: DAX
      expression: DIVIDE ( COALESCE ( [Violations], 0 ), [Inspections with violation data] )
  datatype: Decimal
  description: 'Violations per inspection with violation data (Austin left out). With a category picked, that category''s
    violations per inspection. No OSSIE_SQL_2026 expression: Divides a Fact Violation count by a Fact Inspection
    count. A dataset metric aggregates one dataset, and this twin does not compose model metrics across the two
    facts.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '0.00'
      display_folder: Findings
- name: critical_violations_per_inspection
  expression:
    dialects:
    - dialect: DAX
      expression: DIVIDE ( COALESCE ( [Critical violations], 0 ), [Inspections with violation data] )
  datatype: Decimal
  description: 'The headline comparable measure: critical violations per inspection with violation data (Austin
    left out). Compares what inspectors found, not how each jurisdiction judged it. Still read with Jurisdiction[Critical
    Means]: Toronto''s and Boston''s critical are wider than NYC''s, so NYC''s 1.87 is, if anything, an undercount
    next to them. No OSSIE_SQL_2026 expression: Divides a Fact Violation count by a Fact Inspection count. A dataset
    metric aggregates one dataset, and this twin does not compose model metrics across the two facts.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '0.00'
      display_folder: Findings
- name: share_of_inspections_citing
  expression:
    dialects:
    - dialect: DAX
      expression: DIVIDE ( COALESCE ( [Inspections citing], 0 ), [Inspections with violation data] )
  datatype: Decimal
  description: 'Share of inspections with violation data that cited at least one violation in context (with a category
    picked: the share citing that category, for example pests at 31.8% of NYC routine inspections). No OSSIE_SQL_2026
    expression: Divides a Fact Violation count by a Fact Inspection count. A dataset metric aggregates one dataset,
    and this twin does not compose model metrics across the two facts.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: 0.0%
      display_folder: Findings
- name: chain_critical_per_inspection
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE ( [Critical violations per inspection], KEEPFILTERS ( Establishment[Is Chain] = TRUE
        () ) )
  datatype: Decimal
  description: 'Critical violations per inspection at establishments of the 18 tracked chains. No OSSIE_SQL_2026
    expression: Depends on `critical_violations_per_inspection`, which doesn''t port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '0.00'
      display_folder: Chains
- name: independent_critical_per_inspection
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE ( [Critical violations per inspection], KEEPFILTERS ( Establishment[Is Chain] = FALSE
        () ) )
  datatype: Decimal
  description: 'Critical violations per inspection at every other establishment. No OSSIE_SQL_2026 expression: Depends
    on `critical_violations_per_inspection`, which doesn''t port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '0.00'
      display_folder: Chains
- name: chain_ratio
  expression:
    dialects:
    - dialect: DAX
      expression: IF ( HASONEVALUE ( Jurisdiction[Jurisdiction Key] ), DIVIDE ( [Chain critical per inspection],
        [Independent critical per inspection] ) )
  datatype: Decimal
  description: 'Chain critical per inspection divided by everyone else''s, within one jurisdiction (under 1: chains
    are cited less). Blank unless exactly one jurisdiction is in context, because pooling mixes jurisdictions with
    different critical definitions and chain shares. No OSSIE_SQL_2026 expression: `HASONEVALUE` reads or removes
    what the report has filtered. OSSIE_SQL_2026 metrics have no filter context: no ALL, REMOVEFILTERS, ISFILTERED
    or HASONEVALUE.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '0.00'
      display_folder: Chains
- name: critical_per_inspection_prior_year
  expression:
    dialects:
    - dialect: DAX
      expression: VAR LastDay = [Last inspection date] RETURN CALCULATE ( [Critical violations per inspection],
        SAMEPERIODLASTYEAR ( FILTER ( VALUES ( 'Date'[Date] ), 'Date'[Date] <= LastDay ) ) )
  datatype: Decimal
  description: 'Critical violations per inspection in the same period one year earlier, over the days up to the
    last inspection date. Partial where a jurisdiction''s data starts later (Jurisdiction[Data From]). No OSSIE_SQL_2026
    expression: `SAMEPERIODLASTYEAR` shifts or accumulates dates through the Power BI date table. OSSIE_SQL_2026
    has no time-intelligence functions, and a metric can''t move the query''s date filter.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '0.00'
      display_folder: Time
- name: critical_per_inspection_change
  expression:
    dialects:
    - dialect: DAX
      expression: IF ( NOT ISBLANK ( [Critical per inspection prior year] ), [Critical violations per inspection]
        - [Critical per inspection prior year] )
  datatype: Decimal
  description: 'Change in critical violations per inspection against the same period a year earlier, in violations
    per inspection (a difference, not a percentage). No OSSIE_SQL_2026 expression: Depends on `critical_per_inspection_prior_year`,
    which doesn''t port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: +0.00;-0.00;0.00
      display_folder: Time
- name: attribution
  expression:
    dialects:
    - dialect: DAX
      expression: '"Joined from ten open restaurant-inspection datasets (NYC DOHMH, Chicago CDPH, Public Health
        - Seattle & King County, Austin Public Health, Montgomery County MD HHS, Delaware Division of Public Health,
        Marin County EHS, NYSDOH, Boston ISD, Toronto Public Health DineSafe). Contains information licensed under
        the Open Government Licence - Toronto. Marin County data: Open Database License (ODbL), County of Marin."'
  datatype: String
  description: 'Attribution owed when anything built on the model is published. No OSSIE_SQL_2026 expression: a
    citation or attribution string. Kept in the DAX dialect for reports; there is nothing to aggregate.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '@'
      display_folder: About

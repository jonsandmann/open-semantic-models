metrics:
- name: results
  expression:
    dialects:
    - dialect: DAX
      expression: VAR Release = [Latest result release] RETURN CALCULATE ( COUNTROWS ( 'Fact Measure Result' ),
        'Fact Measure Result'[Release Date] = Release )
  datatype: Decimal
  description: 'Measure result rows in the latest catalog release in context: one per hospital and measure, whether
    or not CMS published a score. Rows, not hospitals. No OSSIE_SQL_2026 expression: counts results in the latest
    release inside the filters. Results are a snapshot per release.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '#,0'
      display_folder: Volume
- name: hospitals_with_a_result
  expression:
    dialects:
    - dialect: DAX
      expression: VAR Release = [Latest result release] RETURN CALCULATE ( DISTINCTCOUNT ( 'Fact Measure Result'[Facility
        ID] ), 'Fact Measure Result'[Release Date] = Release )
  datatype: Decimal
  description: 'Distinct hospitals with at least one measure result row (scored or not) in the latest catalog release
    in context. Unlike Hospitals, this follows Performance Date, Release Date and Quality Measure filters. No OSSIE_SQL_2026
    expression: keeps only the latest date or release inside the current filters (`VAR ... = MAX(...)` then `CALCULATE`).
    One OSSIE_SQL_2026 aggregate can''t pin itself to the max of the query''s own rows without a subquery.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '#,0'
      display_folder: Volume
- name: reported_scores
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE ( [Results], KEEPFILTERS ( NOT ISBLANK ( 'Fact Measure Result'[Score] ) ) )
  datatype: Decimal
  description: 'Measure result rows that carry a published (numeric) score, latest release in context. CMS''s "Not
    Available" is blank and not counted. No OSSIE_SQL_2026 expression: Depends on `results`, which doesn''t port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '#,0'
      display_folder: Volume
- name: results_by_window_start
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE ( [Results], USERELATIONSHIP ( 'Fact Measure Result'[Start Date], 'Performance Date'[Date]
        ) )
  datatype: Decimal
  description: 'Measure result rows counted by the start of their performance window instead of its end, latest
    release in context (uses the inactive Start Date relationship to ''Performance Date''). No OSSIE_SQL_2026 expression:
    `USERELATIONSHIP` reads or removes what the report has filtered. OSSIE_SQL_2026 metrics have no filter context:
    no ALL, REMOVEFILTERS, ISFILTERED or HASONEVALUE.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '#,0'
      display_folder: Volume
- name: results_by_release
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE ( [Results], REMOVEFILTERS ( 'Performance Date' ) )
  datatype: Decimal
  description: 'Measure result rows by catalog release, ignoring any ''Performance Date'' filter: put ''Release
    Date'' on the axis to see each release''s rows, whatever windows they cover. No OSSIE_SQL_2026 expression: `REMOVEFILTERS`
    reads or removes what the report has filtered. OSSIE_SQL_2026 metrics have no filter context: no ALL, REMOVEFILTERS,
    ISFILTERED or HASONEVALUE.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '#,0'
      display_folder: Volume
- name: average_score
  expression:
    dialects:
    - dialect: DAX
      expression: IF ( HASONEVALUE ( 'Quality Measure'[Measure ID] ), VAR Release = [Latest result release] RETURN
        CALCULATE ( AVERAGE ( 'Fact Measure Result'[Score] ), 'Fact Measure Result'[Release Date] = Release ) )
  datatype: Decimal
  description: 'Unweighted mean of published scores in the latest catalog release in context, each hospital counting
    once. Blank unless exactly one quality measure is in scope, because CMS measures are on different scales (a
    death rate near 12 against PSI 90 near 1). "Not Available" scores are ignored, not counted as zero. No OSSIE_SQL_2026
    expression: keeps only the latest date or release inside the current filters (`VAR ... = MAX(...)` then `CALCULATE`).
    One OSSIE_SQL_2026 aggregate can''t pin itself to the max of the query''s own rows without a subquery.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '0.00'
      display_folder: Result
- name: denominator_weighted_score
  expression:
    dialects:
    - dialect: DAX
      expression: IF ( HASONEVALUE ( 'Quality Measure'[Measure ID] ), VAR Release = [Latest result release] VAR
        ScoredRows = FILTER ( 'Fact Measure Result', 'Fact Measure Result'[Release Date] = Release && NOT ISBLANK
        ( 'Fact Measure Result'[Score] ) && NOT ISBLANK ( 'Fact Measure Result'[Denominator] ) ) RETURN DIVIDE (
        SUMX ( ScoredRows, 'Fact Measure Result'[Score] * 'Fact Measure Result'[Denominator] ), SUMX ( ScoredRows,
        'Fact Measure Result'[Denominator] ) ) )
  datatype: Decimal
  description: 'Mean score weighted by each hospital''s denominator (eligible cases), over rows that have both a
    score and a denominator, latest catalog release in context. Blank unless exactly one quality measure is in scope.
    PSI 90 has no denominator (CMS: Not Applicable), so it is blank there. No OSSIE_SQL_2026 expression: keeps only
    the latest date or release inside the current filters (`VAR ... = MAX(...)` then `CALCULATE`). One OSSIE_SQL_2026
    aggregate can''t pin itself to the max of the query''s own rows without a subquery.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '0.00'
      display_folder: Result
- name: total_denominator
  expression:
    dialects:
    - dialect: DAX
      expression: VAR Release = [Latest result release] RETURN CALCULATE ( SUM ( 'Fact Measure Result'[Denominator]
        ), 'Fact Measure Result'[Release Date] = Release )
  datatype: Decimal
  description: 'Sum of denominators (eligible cases) in the latest catalog release in context. Blank where CMS published
    Not Available or Not Applicable. No OSSIE_SQL_2026 expression: keeps only the latest date or release inside
    the current filters (`VAR ... = MAX(...)` then `CALCULATE`). One OSSIE_SQL_2026 aggregate can''t pin itself
    to the max of the query''s own rows without a subquery.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '#,0'
      display_folder: Result
- name: better_than_national
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE ( [Results], KEEPFILTERS ( 'Fact Measure Result'[Compared to National] IN { "Better
        Than the National Rate", "Better Than the National Value" } ) )
  datatype: Decimal
  description: 'Results CMS rates better than the national rate or value (both wordings in the file). No OSSIE_SQL_2026
    expression: Depends on `results`, which doesn''t port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '#,0'
      display_folder: Comparison
- name: worse_than_national
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE ( [Results], KEEPFILTERS ( 'Fact Measure Result'[Compared to National] IN { "Worse Than
        the National Rate", "Worse Than the National Value" } ) )
  datatype: Decimal
  description: 'Results CMS rates worse than the national rate or value (both wordings in the file). No OSSIE_SQL_2026
    expression: Depends on `results`, which doesn''t port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '#,0'
      display_folder: Comparison
- name: no_different_than_national
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE ( [Results], KEEPFILTERS ( 'Fact Measure Result'[Compared to National] IN { "No Different
        Than the National Rate", "No Different Than the National Value" } ) )
  datatype: Decimal
  description: 'Results CMS rates no different from the national rate or value (both wordings in the file). No OSSIE_SQL_2026
    expression: Depends on `results`, which doesn''t port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '#,0'
      display_folder: Comparison
- name: too_small_to_compare
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE ( [Results], KEEPFILTERS ( 'Fact Measure Result'[Compared to National] = "Number of
        Cases Too Small" ) )
  datatype: Decimal
  description: 'Results CMS did not compare because the hospital had too few cases ("Number of Cases Too Small").
    No OSSIE_SQL_2026 expression: Depends on `results`, which doesn''t port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '#,0'
      display_folder: Comparison
- name: not_available_to_compare
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE ( [Results], KEEPFILTERS ( 'Fact Measure Result'[Compared to National] = "Not Available"
        ) )
  datatype: Decimal
  description: 'Results with no comparison ("Not Available"). Every MORT_30_* death-rate row is Not Available here
    even when a score is published, so this is not "same as national" and not "worse". No OSSIE_SQL_2026 expression:
    Depends on `results`, which doesn''t port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '#,0'
      display_folder: Comparison
- name: share_worse
  expression:
    dialects:
    - dialect: DAX
      expression: DIVIDE ( [Worse than national], [Better than national] + [No different than national] + [Worse
        than national] )
  datatype: Decimal
  description: 'Share of compared results that CMS rates worse than national: worse / (better + no different + worse).
    Not Available and too-small results are left out of both sides. No OSSIE_SQL_2026 expression: Depends on `worse_than_national`,
    which doesn''t port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: 0.0%
      display_folder: Comparison
- name: share_better
  expression:
    dialects:
    - dialect: DAX
      expression: DIVIDE ( [Better than national], [Better than national] + [No different than national] + [Worse
        than national] )
  datatype: Decimal
  description: 'Share of compared results that CMS rates better than national: better / (better + no different +
    worse). No OSSIE_SQL_2026 expression: Depends on `better_than_national`, which doesn''t port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:

    dimension:
      is_time: true
    datatype: Date
    description: Calendar date. Primary key, related to the release date of 'Fact Overall Rating' and of 'Fact Measure
      Result'.
    nonportable_extensions:
    - vendor_name: power_bi
      data:
        format_string: yyyy-mm-dd
  - name: year

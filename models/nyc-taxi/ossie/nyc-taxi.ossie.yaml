metrics:
- name: last_trip_date
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE ( MAX ( Trips[Pickup Date] ), REMOVEFILTERS () )
  datatype: Date
  description: 'Latest pickup date loaded, ignoring all filters. Stops time intelligence from projecting past the
    data. No OSSIE_SQL_2026 expression: `REMOVEFILTERS` reads or removes what the report has filtered. OSSIE_SQL_2026
    metrics have no filter context: no ALL, REMOVEFILTERS, ISFILTERED or HASONEVALUE.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: yyyy-mm-dd
      display_folder: Helpers
      is_hidden: true
- name: trips_ytd
  expression:
    dialects:
    - dialect: DAX
      expression: IF ( MIN ( 'Date'[Date] ) <= [Last Trip Date], CALCULATE ( [Trips], DATESYTD ( 'Date'[Date] )
        ) )
  datatype: Decimal
  description: 'Trips from 1 January of the selected year to the end of the selected period. Blank after the last
    loaded date. No OSSIE_SQL_2026 expression: `DATESYTD` shifts or accumulates dates through the Power BI date
    table. OSSIE_SQL_2026 has no time-intelligence functions, and a metric can''t move the query''s date filter.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '#,0'
      display_folder: Time Intelligence\Trips
- name: trips_py
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE ( [Trips], CALCULATETABLE ( DATEADD ( 'Date'[Date], -1, YEAR ), 'Date'[Through Last
        Trip Date] = TRUE ) )
  datatype: Decimal
  description: 'Trips in the same period one year earlier, limited to dates on or before the last loaded pickup
    date, so a period that runs past the loaded data compares like for like. No OSSIE_SQL_2026 expression: `DATEADD`
    shifts or accumulates dates through the Power BI date table. OSSIE_SQL_2026 has no time-intelligence functions,
    and a metric can''t move the query''s date filter.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '#,0'
      display_folder: Time Intelligence\Trips
- name: trips_py_ytd
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE ( [Trips YTD], CALCULATETABLE ( DATEADD ( 'Date'[Date], -1, YEAR ), 'Date'[Through Last
        Trip Date] = TRUE ) )
  datatype: Decimal
  description: 'Year-to-date trips for the same period one year earlier. No OSSIE_SQL_2026 expression: `DATEADD`
    shifts or accumulates dates through the Power BI date table. OSSIE_SQL_2026 has no time-intelligence functions,
    and a metric can''t move the query''s date filter.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: '#,0'
      display_folder: Time Intelligence\Trips
- name: trips_yoy
  expression:
    dialects:
    - dialect: DAX
      expression: VAR CurrentValue = [Trips] VAR PriorValue = [Trips PY] RETURN IF ( NOT ISBLANK ( CurrentValue
        ) && NOT ISBLANK ( PriorValue ), CurrentValue - PriorValue )
  datatype: Decimal
  description: 'Change in trips against the same period one year earlier. Blank when either year has no data. No
    OSSIE_SQL_2026 expression: Depends on `trips_py`, which doesn''t port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: +#,0;-#,0;0
      display_folder: Time Intelligence\Trips
- name: trips_yoy_pct
  expression:
    dialects:
    - dialect: DAX
      expression: DIVIDE ( [Trips YoY], [Trips PY] )
  datatype: Decimal
  description: 'Percentage change in trips against the same period one year earlier. No OSSIE_SQL_2026 expression:
    Depends on `trips_yoy`, which doesn''t port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: +0.0%;-0.0%;0.0%
      display_folder: Time Intelligence\Trips
- name: trips_ytd_yoy_pct
  expression:
    dialects:
    - dialect: DAX
      expression: DIVIDE ( [Trips YTD] - [Trips PY YTD], [Trips PY YTD] )
  datatype: Decimal
  description: 'Percentage change in year-to-date trips against the same span one year earlier. No OSSIE_SQL_2026
    expression: Depends on `trips_ytd`, which doesn''t port.'
  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: +0.0%;-0.0%;0.0%
      display_folder: Time Intelligence\Trips
- name: total_revenue_ytd
  expression:
    dialects:
    - dialect: DAX
      expression: IF ( MIN ( 'Date'[Date] ) <= [Last Trip Date], CALCULATE ( [Total Revenue], DATESYTD ( 'Date'[Date]
        ) ) )
  datatype: Decimal
  description: 'Total revenue from 1 January of the selected year to the end of the selected period. Blank after
    the last loaded date. No OSSIE_SQL_2026 expression: `DATESYTD` shifts or accumulates dates through the Power

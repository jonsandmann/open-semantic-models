    - dialect: DAX
      expression: CALCULATE ( [Total Revenue], CALCULATETABLE ( DATEADD ( 'Date'[Date], -1, YEAR ), 'Date'[Through
        Last Trip Date] = TRUE ) )
  datatype: Decimal
  description: 'Total revenue in the same period one year earlier, limited to dates on or before the last loaded

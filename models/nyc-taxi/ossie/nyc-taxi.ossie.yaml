  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: +0.0%;-0.0%;0.0%
      display_folder: Time Intelligence\Revenue
- name: avg_fare_per_trip_py
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE ( [Avg Fare per Trip], CALCULATETABLE ( DATEADD ( 'Date'[Date], -1, YEAR ), 'Date'[Through

  nonportable_extensions:
  - vendor_name: power_bi
    data:
      format_string: $#,0;($#,0);$#,0
      display_folder: Time Intelligence\Revenue
- name: total_revenue_py_ytd
  expression:
    dialects:
    - dialect: DAX
      expression: CALCULATE ( [Total Revenue YTD], CALCULATETABLE ( DATEADD ( 'Date'[Date], -1, YEAR ), 'Date'[Through
        Last Trip Date] = TRUE ) )
  datatype: Decimal
  description: 'Year-to-date total revenue for the same period one year earlier. No OSSIE_SQL_2026 expression: `DATEADD`
    shifts or accumulates dates through the Power BI date table. OSSIE_SQL_2026 has no time-intelligence functions,

- name: total_revenue_yoy
  expression:
    dialects:
    - dialect: DAX
      expression: VAR CurrentValue = [Total Revenue] VAR PriorValue = [Total Revenue PY] RETURN IF ( NOT ISBLANK
        ( CurrentValue ) && NOT ISBLANK ( PriorValue ), CurrentValue - PriorValue )
  datatype: Decimal
  description: 'Change in total revenue against the same period one year earlier. Blank when either year has no
